- name: Launch database
  community.docker.docker_container:
    name: tp-db
    image: constant4n/tp-devops-database
    networks:
      - name: app-network
    env:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python